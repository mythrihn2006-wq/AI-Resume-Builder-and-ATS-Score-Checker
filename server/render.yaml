services:
  - type: web
    name: ats-resume-builder-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://your_username:your_password@cluster0.xxxxx.mongodb.net/ats_resume_builder
      - key: JWT_SECRET
        value: your_jwt_secret_key_here
      - key: GEMINI_API_KEY
        value: your_gemini_api_key_here
    healthCheckPath: /api/health
